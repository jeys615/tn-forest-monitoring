<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="satGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D6A4F" />
      <stop offset="100%" stop-color="#1B4332" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52B788" />
      <stop offset="100%" stop-color="#2D6A4F" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52B788" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1B4332" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Outer Ring Boundary -->
  <circle cx="250" cy="250" r="220" fill="none" stroke="#1B4332" stroke-width="6" opacity="0.4" />

  <!-- Earth Globe Body -->
  <circle cx="250" cy="250" r="170" fill="#0D1F18" stroke="#2D6A4F" stroke-width="5" />
  
  <!-- Latitude & Longitude Subtle Grid -->
  <ellipse cx="250" cy="250" rx="170" ry="85" fill="none" stroke="#2D6A4F" stroke-width="2" stroke-dasharray="6,6" opacity="0.35" />
  <ellipse cx="250" cy="250" rx="85" ry="170" fill="none" stroke="#2D6A4F" stroke-width="2" stroke-dasharray="6,6" opacity="0.35" />
  <line x1="250" y1="80" x2="250" y2="420" stroke="#2D6A4F" stroke-width="2" stroke-dasharray="6,6" opacity="0.35" />
  <line x1="80" y1="250" x2="420" y2="250" stroke="#2D6A4F" stroke-width="2" stroke-dasharray="6,6" opacity="0.35" />

  <!-- Stylized Landmass Continents -->
  <path d="M 170 140 Q 210 120 240 150 Q 260 170 230 200 Q 200 230 180 200 Q 150 180 170 140 Z" fill="#52B788" opacity="0.85" />
  <path d="M 270 160 Q 320 150 350 190 Q 360 230 330 250 Q 300 260 280 220 Q 260 190 270 160 Z" fill="#52B788" opacity="0.8" />
  <path d="M 190 250 Q 230 240 240 280 Q 250 330 220 370 Q 190 350 180 300 Q 170 270 190 250 Z" fill="#52B788" opacity="0.85" />
  <path d="M 290 270 Q 340 280 360 320 Q 350 360 310 360 Q 280 330 290 270 Z" fill="#52B788" opacity="0.75" />

  <!-- Orbital Trajectory Swoosh -->
  <path d="M 80 360 C 50 200 160 80 340 90 C 440 95 470 210 390 330 C 330 420 180 440 100 370" 
        fill="none" stroke="url(#orbitGrad)" stroke-width="9" stroke-linecap="round" />
  <ellipse cx="250" cy="250" rx="205" ry="120" transform="rotate(-30 250 250)" 
           fill="none" stroke="#74C69D" stroke-width="3" stroke-dasharray="8,8" opacity="0.6" />

  <!-- Satellite System (Angled at upper right / center orbit) -->
  <g transform="translate(330, 110) rotate(-35)">
    <!-- Communication Dish Receiver -->
    <path d="M -15 -25 A 20 20 0 0 1 15 -25 Z" fill="#D8F3DC" stroke="#1B4332" stroke-width="2" />
    <line x1="0" y1="-25" x2="0" y2="-38" stroke="#D8F3DC" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="-38" r="4" fill="#52B788" />

    <!-- Satellite Central Chassis Body -->
    <rect x="-22" y="-20" width="44" height="50" rx="6" fill="url(#satGrad)" stroke="#74C69D" stroke-width="3" />
    <!-- Chassis details / sensor lenses -->
    <circle cx="0" cy="5" r="9" fill="#0D1F18" stroke="#52B788" stroke-width="2" />
    <circle cx="0" cy="5" r="4" fill="#74C69D" />
    <rect x="-14" y="22" width="28" height="6" rx="2" fill="#52B788" />

    <!-- Left Solar Array Wing -->
    <g transform="translate(-25, 5)">
      <line x1="0" y1="0" x2="-20" y2="0" stroke="#74C69D" stroke-width="4" />
      <rect x="-110" y="-30" width="90" height="60" rx="3" fill="url(#panelGrad)" stroke="#1B4332" stroke-width="2" />
      <!-- Solar cell grid lines -->
      <line x1="-80" y1="-30" x2="-80" y2="30" stroke="#0D1F18" stroke-width="2" />
      <line x1="-50" y1="-30" x2="-50" y2="30" stroke="#0D1F18" stroke-width="2" />
      <line x1="-110" y1="-10" x2="-20" y2="-10" stroke="#0D1F18" stroke-width="2" />
      <line x1="-110" y1="10" x2="-20" y2="10" stroke="#0D1F18" stroke-width="2" />
    </g>

    <!-- Right Solar Array Wing -->
    <g transform="translate(25, 5)">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#74C69D" stroke-width="4" />
      <rect x="20" y="-30" width="90" height="60" rx="3" fill="url(#panelGrad)" stroke="#1B4332" stroke-width="2" />
      <!-- Solar cell grid lines -->
      <line x1="50" y1="-30" x2="50" y2="30" stroke="#0D1F18" stroke-width="2" />
      <line x1="80" y1="-30" x2="80" y2="30" stroke="#0D1F18" stroke-width="2" />
      <line x1="20" y1="-10" x2="110" y2="-10" stroke="#0D1F18" stroke-width="2" />
      <line x1="20" y1="10" x2="110" y2="10" stroke="#0D1F18" stroke-width="2" />
    </g>

    <!-- Signal Propagation Waves -->
    <path d="M -12 40 A 18 18 0 0 0 12 40" fill="none" stroke="#74C69D" stroke-width="2.5" stroke-linecap="round" />
    <path d="M -18 48 A 26 26 0 0 0 18 48" fill="none" stroke="#52B788" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <path d="M -24 56 A 34 34 0 0 0 24 56" fill="none" stroke="#2D6A4F" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>
